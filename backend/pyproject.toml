[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon"
version = "0.7.0"
description = "事件驱动信息收集引擎 (BBOT 事件模型 x ARL 能力实现), 不使用 Docker"
# readme 指向仓库根，而 pyproject 在 backend/ 下 —— 跨出项目目录的路径
# setuptools 不一定接受，所以这里干脆不声明，文档以仓库根 README.md 为准。
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "dnspython>=2.2",
    "PyYAML>=6.0",
    # favicon 哈希（Shodan 口径）。缺了它探测仍能跑，但 favicon 指纹静默失效。
    "mmh3>=4.0",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
screenshot = ["playwright>=1.40"]
export = ["openpyxl>=3.1"]
# ⚠️ **dev 必须能直接跑起全量测试。**
# 原来只有 pytest，于是 `pip install -e .[dev]` 之后 `tests/base.py` 的
# `from fastapi.testclient import TestClient` 直接 ImportError —— 也就是
# 说「1426 条用例」在一个按文档装出来的干净环境里**根本跑不起来**，
# 只在开发机（早就装过 web extra）上绿。
# 测试基类要 TestClient，所以 fastapi/uvicorn 属于测试的**必要依赖**，
# 不是可选功能。
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
recon = "core.server:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
"core.presets" = ["*.yml"]
"core.storage" = ["*.sql"]
# 随包分发的静态资源（字典 / 指纹 / CDN 库 / 端口集）。
# 与 <仓库根>/data/ 无关 —— 那个是运行时产物，不进包。
"core.resources" = ["*.json", "*.txt", "*.md"]
# 前端不再打包进 Python 包: 它是独立的 frontend/ 工程, 构建产物由后端在
# 运行时按路径查找 (见 recon/util/paths.py::frontend_dist)

[tool.pytest.ini_options]
testpaths = ["tests"]
# ⚠️ **协程从未被 await 视为错误，而不是警告。**
#
# 往同步的 ``unittest.TestCase`` 里塞一个 ``async def`` 用例，pytest
# 只会发一条 RuntimeWarning 然后**照常算它通过** —— 一条根本没跑的用例
# 混在全绿的报告里，比失败危险得多（实测踩过：114 passed 里混着一条
# 一次都没执行的端口存活用例）。
#
# 提到 error 之后它当场失败，问题一眼可见。
filterwarnings = [
    "error::RuntimeWarning",
    # ⚠️ **光有上面那条抓不全。** 实测（2026-10-07，写 passive_virustotal 时）
    # 同一个错误**绕过去了**：pytest 把那条 RuntimeWarning 包进
    # ``PytestUnraisableExceptionWarning`` 再发出来，于是 filter 匹配不上、
    # 降级成普通 warning，5 条 async 用例照样「全绿」而一次都没跑。
    #
    # 所以这里把 pytest 自己包的那层也提为 error。两层都要在，是因为
    # 一次没跑的用例**伪装成通过**，比它响亮地红起来危险得多 ——
    # 而 warnings summary 里那 12 条 warning 就是唯一的线索，不能靠人眼。
    "error::pytest.PytestUnraisableExceptionWarning",
    # ⚠️ **别加 ``error::pytest.PytestUnhandledCoroutineWarning``**（2026-10-07
    # 实测纠正）。那个类名在 **pytest 9.1.1 里根本不存在** —— 写上去 pytest
    # **启动即 AttributeError**，全仓一条测试都跑不了。而"模块级 async 会静默
    # skip"这个前提也不成立：实测它会**失败**（"async def functions are not
    # natively supported"）。
    #
    # 同步 TestCase 里的 async 用例（有 1 条 extra）留下的**第二条**痕迹是
    # ``PytestReturnNotNoneWarning``（"It is deprecated to return a value that
    # is not None from a test case"）。上面两条抓的是「协程没被 await」，
    # 这一条抓的是「TestCase 没真的跑」—— 同一类假绿，两个信号都收。
    "error::pytest.PytestReturnNotNoneWarning",
]
